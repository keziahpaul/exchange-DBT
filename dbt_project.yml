target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

seeds:
  pexa_one_data_au_exchange_dbt:
    logging:
      +database: "{{env_var('DBT_LOGGING_DB')}}"
      +schema: "{{env_var('DBT_LOG_MAPPING_SCHEMA')}}"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In dbt, the default materialization for a model is a view. This means, when you run
# dbt run or dbt build, all of your models will be built as a view in your data platform.
# The configuration below will override this setting for models in the example folder to
# instead be materialized as tables. Any models you add to the root of the models folder will
# continue to be built as views. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
on-run-end:
  - "{{ dbt_artifacts.upload_results(results) }}"

# unless its business-critical db or data quality issues that have downstream impact it should error
# otherwise it should not break pipelines
tests:
  +severity: warn

models:
  pexa_one_data_au_exchange_dbt:
    +persist_docs:
      relation: true
      columns: true
    +post-hook:
      - >
        {% if flags.WHICH in ('run', 'build') %}
          {{ dbt_tags.apply_column_tags() }}
        {% endif %}
        
    raw:
      +database: "{{env_var('DBT_EXCHANGE_RAW_DB')}}"
      api_logs:
        +schema: "{{env_var('DBT_API_LOGS_RAW_SCHEMA')}}"
      pexakey:
        +pre-hook: "ALTER SESSION SET TIMEZONE = 'Australia/Sydney'"
        +schema: "{{env_var('DBT_PEXAKEY_RAW_SCHEMA')}}"
      api_push_notification:
        +pre-hook: 'ALTER SESSION SET TIMEZONE = ''Australia/Sydney'''
        +schema: "{{env_var('DBT_PUSH_NOTIFICATION_SCHEMA')}}"
      exchange:
        +schema: "{{env_var('DBT_EXCHANGE_RAW_SCHEMA')}}"
        +materialized: materialized_view_snowflake
        +persist_docs:
          relation: false
          columns: false
      projects:
        +schema: "{{env_var('DBT_PROJECTS_SCHEMA')}}"
        +materialized: materialized_view_snowflake
        +persist_docs:
          relation: false
          columns: false

    stage:
      +database: "{{env_var('DBT_EXCHANGE_STAGE_DB')}}"
      exchange:
        +schema: "{{env_var('DBT_EXCHANGE_STAGE_SCHEMA')}}"
        +materialized: incremental
        +incremental_strategy: append
        +transient: false
        stg_pxa_documents:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_lodgements:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_invitations:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_gst:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_participants:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_settlements:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_settlement_schedules:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_subscribers:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_workspace_roles:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        stg_pxa_workspaces:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"

      projects:
        +schema: "{{env_var('DBT_PROJECTS_SCHEMA')}}"
        +materialized: incremental
        +incremental_strategy: append
        +transient: "{{ env_var('DBT_ENV_NAME') != 'PRD' }}"

    curate:
      +database: "{{env_var('DBT_EXCHANGE_CURATE_DB')}}"
      exchange:
        +schema: "{{env_var('DBT_EXCHANGE_CURATE_SCHEMA')}}"
        pxa_documents:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_lodgements:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_invitations:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_gst:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_participants:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_settlements:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_settlement_schedules:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_subscribers:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_workspace_roles:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
        pxa_workspaces:
          +snowflake_warehouse: "{{ env_var('DBT_ENV_NAME') | upper | replace('CI', 'TST') }}_TRN_S_WH"
      exchange_views:
        +schema: "{{env_var('DBT_EXCHANGE_CURATE_SCHEMA')}}"
      projects:
        +schema: "{{env_var('DBT_PROJECTS_SCHEMA')}}"
      api_logs:
        +schema: "{{env_var('DBT_API_LOGS_CURATE_SCHEMA')}}"
        +snowflake_warehouse: "{{env_var('DBT_API_LOGS_CURATE_WH')}}"
      pexakey:
        +pre-hook: "ALTER SESSION SET TIMEZONE = 'Australia/Sydney'"
        +schema: "{{env_var('DBT_PEXAKEY_CURATE_SCHEMA')}}"
        curate_table:
          rds_address:
            +alias: address
          rds_task:
            +alias: task
          rds_subscriber:
            +alias: subscriber
          rds_tracking:
            +alias: tracking
          rds_tracking_user:
            +alias: tracking_user
      api_push_notification:
        +pre-hook: 'ALTER SESSION SET TIMEZONE = ''Australia/Sydney'''
        +schema: "{{env_var('DBT_PUSH_NOTIFICATION_SCHEMA')}}"
        outbound_notification_curate:
            +alias: outbound_notification
        registration_curate:
            +alias: registration
        webhook_registration_curate:
            +alias: webhook_registration

    data_services:
      +secure: true
      +database: "{{env_var('DBT_EXCHANGE_DATASERVICES_DB')}}"
      exchange:
        +secure: true
        +copy_grants: true
        +schema: "{{env_var('DBT_EXCHANGE_DATASERVICES_SCHEMA')}}"
      projects:
        +schema: "{{env_var('DBT_PROJECTS_SCHEMA')}}"
        +copy_grants: true
      api_logs:
        +copy_grants: true
        +schema: "{{env_var('DBT_API_LOGS_DATASERVICES_SCHEMA')}}"
      pexakey:
        +pre-hook: "ALTER SESSION SET TIMEZONE = 'Australia/Sydney'"
        +schema: "{{env_var('DBT_PEXAKEY_DATASERVICES_SCHEMA')}}"
        +copy_grants: true
        ds_view:
          vw_ds_all_users_store:
            +alias: vw_all_users_store
          vw_ds_bank_account_store:
            +alias: vw_bank_account_store
          vw_ds_property_store:
            +alias: vw_property_store
          vw_ds_property_settlement:
            +alias: vw_property_settlement
      api_push_notification:
        +schema: "{{env_var('DBT_PUSH_NOTIFICATION_SCHEMA')}}"
        +copy_grants: true
          
    logging:
      +database: "{{env_var('DBT_LOGGING_DB')}}"
      trustcenter:
        +schema: "{{env_var('DBT_TRUSTCENTER_SCHEMA')}}"

  dbt_artifacts:
    +database: "{{env_var('DBT_LOGGING_DB')}}"
    +schema: "{{env_var('DBT_LOGGING_SCHEMA')}}"
