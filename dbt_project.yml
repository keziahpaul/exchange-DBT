
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'pexa_one_data_au_exchange_dbt'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

flags:
  warn_error_options:
    silence:
      - InvalidMacroAnnotation

vars:
    DBT_ENV_NAME: "{{env_var('DBT_ENV_NAME')}}"
    dbt_tags__database: "{{env_var('DBT_GOVERNANCE_DB')}}"
    dbt_tags__schema: "{{env_var('DBT_GOVERNANCE_SCHEMA')}}"
    dbt_tags__resource_types: ["model", "snapshot", "source"]
    dbt_tags__opt_in_default_naming_config: false
    dbt_tags__allowed_tags: ["secure_field", "variant_mask"]
    dbt_tags__tag_name_separator: "="
    inserted_at: CONVERT_TIMEZONE('Australia/Sydney',CURRENT_TIMESTAMP(2))
    updated_at: CONVERT_TIMEZONE('Australia/Sydney',CURRENT_TIMESTAMP(2))
    active_date: '9999-12-31'
    low_date: '1900-01-01'
    primary_keys_dict: 
      pxa_accounts: 'account_id'
      pxa_addresses: 'address_id'
      pxa_api_req_resp_audit: 'api_req_resp_audit_id'
      pxa_application_roles: 'application_role_id'
      pxa_batch_tac: 'tac_batch_id'
      pxa_billing_transactions: 'bllng_rqst_trnsctns_id'
      pxa_business_event: 'business_event_id'
      pxa_business_event_categories: 'business_event_category_id'
      pxa_business_event_details: 'id'
      pxa_business_event_outbox: 'business_event_id'
      pxa_business_event_ref_types: 'business_event_ref_type_id'
      pxa_business_event_reference: 'business_event_reference_id'
