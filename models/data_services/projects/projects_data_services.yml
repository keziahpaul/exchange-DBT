version: 2

models:
  - name: vw_api_usage_audit
    data_tests:
      - check_one_active_row:
          arguments:
            pk_field_list: id
    columns:
      - name: email
        tags:
          - secure_field=PI_EMAIL
        description: Email of the user associated with an API request
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63603;otype=attribute
            alation_title: Email

      - name: authorised_party
        description: User identifier from OAuth2 token, matches to secondary system
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63249;otype=attribute
            alation_title: Authorised Party

      - name: created_at
        description: Time that an API request was received
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=63620;otype=attribute
            alation_title: Created At

      - name: effective_from
        description: <div><p>The time when the record was first created or modified
          in the source, based on a timestamp value in the source table that monotonically
          increases over time with data change or update.</p><p>Usually it corresponds
          to the Fivetran Start Timestamp column in the raw layer.</p></div>
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=63730;otype=attribute
            alation_title: Effective From
            orig_data_type: timestamp_tz

      - name: effective_to
        description: <div><p>The time until the record was active minus epsilon, where
          epsilon is the smallest time difference that can be stored in the timestamp
          type value. The value for this column depends on the corresponding record's
          status - whether it is active or not - and the destination type.</p><p>Corresponds
          to column Fivetran End Timestamp in raw layer.</p></div>
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=63442;otype=attribute
            alation_title: Effective To
            orig_data_type: timestamp_tz

      - name: endpoint_name
        description: Name of the endpoint called for an API call
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63355;otype=attribute
            alation_title: Endpoint Name

      - name: id
        description: ID for an audit record
        data_type: number
        config:
          meta:
            alation_oid: oid=63596;otype=attribute
            alation_title: Id

      - name: integrator
        description: User for an API Request
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63786;otype=attribute
            alation_title: Integrator

      - name: integrator_type
        description: OAuth2 type used for the request
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63802;otype=attribute
            alation_title: Integrator Type

      - name: oauth_grant_type
        description: OAuth2 grant type used for an API request
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63263;otype=attribute
            alation_title: Oauth Grant Type

      - name: pexa_core_workspace_id
        description: WorkspaceID from Pexa core
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63483;otype=attribute
            alation_title: Pexa Core Workspace Id

      - name: project_id
        description: ID reference to a Project
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63642;otype=attribute
            alation_title: Project Id

      - name: project_name
        description: Name reference to a project
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63608;otype=attribute
            alation_title: Project Name

      - name: subscriber_id
        description: ID Reference to a subscriber
        data_type: varchar
        config:
          meta:
            alation_oid: oid=63842;otype=attribute
            alation_title: Subscriber Id

      - name: sys_inserted_at
        description: <div><p>This Column shows when we successfully extracted the
          data from the source. The destination data matches the data as it appeared
          in the source at the time shown in the column.</p><p> Corresponds to Fivetran
          Synced Timestamp in raw layer</p></div>
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=63846;otype=attribute
            alation_title: System Inserted At

      - name: sys_updated_at
        description: <div><p>System Updated At is a timetsamp column derived from
          _fivetran_end and _fivetran_synced columns in raw. </p><p>If _fivetran_end
          is NOT equal to 9999-12-31 then updated_at value = _fivetran_end timestamp.
          Otherwise, updated_at value = fivetran_synced. </p></div>
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=63825;otype=attribute
            alation_title: System Updated At

      - name: inserted_at
        description: Inserted At
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=153701;otype=attribute
            alation_title: Inserted At

      - name: updated_at
        description: Updated At
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=153483;otype=attribute
            alation_title: Updated At
    description: Audit log of external API requests and which endpoint they requested
