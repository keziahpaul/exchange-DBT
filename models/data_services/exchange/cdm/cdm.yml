version: 2

models:
  - name: stg_cdm_workspace_status
    description: |
      This is the staging table for the workspace data from the PEXA application.
      It is used to transform the raw data from the source into a format that can be easily consumed by the dimensional model.
      It is also used to join to the dim_workspace_status table to provide the id for any fact table that needs to reference the status of a workspace.
    data_tests:
      - dbt_constraints.primary_key:
          name: stg_cdm_workspace_status_has_pk
          arguments:
            column_names:
              - id
              - extraction_ts
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: stg_cdm_workspace_status_has_same_row_count_as_source
          config:
            where: "'{{env_var('DBT_ENV_NAME') | lower}}' <> 'prd'"
          arguments:
            compare_model: "(SELECT DISTINCT workspace_id, version FROM {{ ref('stg_pxa_workspaces') }} WHERE number1 <> 'Default')"
            compare_row_condition: "'{{env_var('DBT_ENV_NAME') | lower}}' <> 'prd'"
    columns:
      - name: id
        data_tests:
          - not_null
      - name: extraction_ts
        data_tests:
          - not_null
      - name: status_id
        data_tests:
          - not_null
      - name: created_date
        data_tests:
          - not_null

  - name: stg_cdm_workspace_event
    description: |
      This is the staging table for the workspace event data from the PEXA application.
      It is used to transform the raw data from the source into a format that can be easily consumed by the dimensional model.
      It is also used to join to the dim_workspace_status table to provide the id for any fact table that needs to reference the status of a workspace.
    data_tests:
      - dbt_constraints.primary_key:
          name: stg_cdm_workspace_event_has_pk
          config:
            where: "'{{env_var('DBT_ENV_NAME') | lower}}' <> 'prd'"
          arguments:
            column_names:
              - id
              - extraction_ts
      - dbt_expectations.expect_compound_columns_to_be_unique:
          name: stg_cdm_workspace_event_has_recent_pk
          arguments:
            column_list: ["id", "extraction_ts"]
            row_condition: "extraction_ts > CURRENT_DATE - 7"
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: stg_cdm_workspace_event_has_same_row_count_as_source
          config:
            where: "'{{env_var('DBT_ENV_NAME') | lower}}' <> 'prd'"
          arguments:
            compare_model: "(SELECT DISTINCT business_event_id FROM {{ ref('stg_pxa_business_event') }} WHERE workspace_id IS NOT NULL)"
            compare_row_condition: "'{{env_var('DBT_ENV_NAME') | lower}}' <> 'prd'"
    columns:
      - name: id
        data_tests:
          - not_null
      - name: extraction_ts
        data_tests:
          - not_null
      - name: created_date
        data_tests:
          - not_null
      - name: workspace_id
        data_tests:
          - not_null
      - name: user_id
        config:
          tags:
            - secure_field=PI_USERID
      - name: username
        config:
          tags:
            - secure_field=PI_EMAIL
      - name: subscriber_id
        config:
          tags:
            - secure_field=PI_USERID

  - name: dim_workspace
    description: |
      This is the workspace dimension. It is used to identify unique workspaces.
    columns:
      - name: id
        description: Internal Workspace ID which is assigned when the workspace is created for the purpose of a transaction.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: workspace_number
        description: External Workspace ID.
        data_type: varchar
        data_tests:
          - not_null
      - name: jurisdiction
        description: The Australian state/territory this workspace relates to.
        data_type: varchar
        data_tests:
          - not_null
      - name: created_date
        description: The date and time this workspace was created.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: ws_transaction_type
        description: Workspace transaction type. ie. TRANSFER, REFINANCE
        data_type: varchar
        data_tests:
          - not_null
      - name: bundle_type
        description: The type of lodgement support services bundle which affects available services and bundled pricing for those services.
        data_type: varchar
        data_tests:
          - not_null

  - name: fact_workspace_status
    description: |
      This is the workspace fact-ish table.
    data_tests:
      - dbt_constraints.primary_key:
          name: fact_workspace_status_has_pk
          arguments:
            column_names:
              - id
              - event_ts

  - name: fact_workspace_event
    description: |
      This is the workspace event fact-ish table.
    data_tests:
      - dbt_constraints.primary_key:
