    columns:
      - name: id
        data_tests:
          - dbt_expectations.expect_column_values_to_be_unique:
              name: fact_workspace_event_has_recent_pk
              arguments:
                row_condition: "created_date > CURRENT_DATE - 7"
      - name: user_id
        config:
          tags:
            - secure_field=PI_USERID
      - name: username
        config:
          tags:
            - secure_field=PI_EMAIL
      - name: subscriber_id
