            pk_field_list: id
          config:
            severity: error
      - check_one_active_row:
          arguments:
            pk_field_list: id
          config:
            severity: error
    columns:
      - name: id
        description: Id, unique identifier
        data_type: varchar

      - name: version
        data_type: number

      - name: record_created
        data_type: timestamp_tz

      - name: record_updated
        data_type: timestamp_tz

      - name: subscriber_id
        data_type: varchar

      - name: subscriber_name
        tags:
          - secure_field=PI_BUSINESS_NAME
        data_type: varchar

      - name: inserted_at
        description: Source Filename
        data_type: timestamp_tz

      - name: load_type
        description: Tells if the record was inserted as part of an incremental or
          full load
        data_type: varchar

  - name: rds_tracking_user
    description: Raw table for PEXAKey tracking user ( property settelment RDS)
