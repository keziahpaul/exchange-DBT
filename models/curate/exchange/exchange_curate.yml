version: 2

models:
  - name: pxa_accounts
    data_tests:
      - column_count_check:
          arguments:
            source: ref('stg_pxa_accounts')
      - check_one_active_row:
          arguments:
            pk_field_list: account_id
          config:
            severity: error
      - check_unique_pk_effective_from:
          arguments:
            pk_field_list: account_id
      - check_record_effectiveness_overlap:
          arguments:
            pk_field_list: account_id
      - count_check_of_insert_updates
      - records_deleted_in_src_but_valid_in_target
    columns:
      - name: account_id
        data_tests:
          - not_null
        description: A unique PEXA generated identifier for each bank account used
          on the platform.
        data_type: number
        config:
          meta:
            alation_oid: oid=106780;otype=attribute
            alation_title: Account Id

      - name: version
        data_tests:
          - not_null
        description: Version
        data_type: number
        config:
          meta:
            alation_oid: oid=107756;otype=attribute
            alation_title: Version

      - name: holder
        tags:
          - secure_field=PI_FULL_NAME
        description: Holder
        data_type: varchar
        config:
          meta:
            alation_oid: oid=107992;otype=attribute
            alation_title: Holder

      - name: bsb
        tags:
          - secure_field=PI_SENSITIVE_FINANCIAL
        description: "<div><p>A Bank State Branch (often referred to as \"BSB\") is\
          \ the name used in Australia for a bank code, which is a branch identifier.\_\
          </p><p>A BSB is normally used in association with the account number.</p></div>"
        data_type: varchar
        config:
          meta:
            alation_oid: oid=108200;otype=attribute
            alation_title: Bank State Branch

      - name: number1
        tags:
          - secure_field=PI_SENSITIVE_FINANCIAL
        description: Bank account number.
        data_type: varchar
        config:
          meta:
            alation_oid: oid=108433;otype=attribute
            alation_title: Number 1

      - name: deleted_at
        description: Deleted At
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=107427;otype=attribute
            alation_title: Deleted At

      - name: effective_from
        description: Effective From
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=106838;otype=attribute
            alation_title: Effective From

      - name: effective_to
        description: Effective To
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=108055;otype=attribute
            alation_title: Effective To

      - name: extraction_start_ts
        description: Extraction Start Timestamp
        data_type: timestamp_ntz
        config:
          meta:
            alation_oid: oid=107730;otype=attribute
            alation_title: Extraction Start Timestamp

      - name: financialaccount_id
        description: Financial Account Id
        data_type: number
        config:
          meta:
            alation_oid: oid=107598;otype=attribute
            alation_title: Financial Account Id

      - name: inserted_at
        description: Inserted At
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=108615;otype=attribute
            alation_title: Inserted At

      - name: key_hash
        description: Key Hash
        data_type: number
        config:
          meta:
            alation_oid: oid=106652;otype=attribute
            alation_title: Key Hash

      - name: row_hash
        description: Row Hash
        data_type: number
        config:
          meta:
            alation_oid: oid=107823;otype=attribute
            alation_title: Row Hash

      - name: src_delta_extract_ts
        description: Source Delta Extract Timestamp
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=106557;otype=attribute
            alation_title: Source Delta Extract Timestamp

      - name: type1
        description: When creating a new financial line item (FLI) for loan proceeds,
          loan payouts or lodgement fees, a new pxa_account record is created with
          type1 set to SETTLING or LODGE_FEE_ACCOUNT based on the FLI category.
        data_type: varchar
        config:
          meta:
            alation_oid: oid=107658;otype=attribute
            alation_title: Type 1

      - name: updated_at
        description: Updated At
        data_type: timestamp_tz
        config:
          meta:
            alation_oid: oid=106774;otype=attribute
            alation_title: Updated At
    description: Accounts
    config:
      meta:
        alation_oid: oid=4151;otype=table
        alation_title: Accounts

