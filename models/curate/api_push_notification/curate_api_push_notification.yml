version: 2

models:
  

  - name: outbound_notification_curate
    description: Curate with scd2 for outbound_notification
    tests:
      - check_unique_pk_effective_from:
          pk_field_list: id
          config:
            severity: error
      - check_record_effectiveness_overlap:
          pk_field_list: id
          config:
            severity: error
      - check_one_active_row:
          pk_field_list: id
          config:
            severity: error
    columns:
      - name: id
        description: Id, unique identifier
        data_type: varchar

      - name: registration_id
        data_type: varchar

      - name: status
        data_type: varchar

      - name: created_at
        data_type: timestamp_tz

      - name: updated_at_src
        data_type: timestamp_tz

      - name: data
        data_type: varchar

      - name: retry_count
        data_type: number

      - name: last_sent_at
        data_type: timestamp_tz

      - name: next_retry_at
        data_type: timestamp_tz

      - name: trace_id
        data_type: varchar

      - name: event_type
        data_type: varchar

      - name: workspace_id
        data_type: varchar

      - name: inserted_at
        description: date and time when the data was ingested in RAW table in snowflake.
        data_type: timestamp_tz

  - name: registration_curate
    description: Raw table for PEXAKey Task ( property settelment RDS)
    tests:
      - check_unique_pk_effective_from:
          pk_field_list: id
          config:
            severity: error
      - check_record_effectiveness_overlap:
          pk_field_list: id
          config:
            severity: error
      - check_one_active_row:
          pk_field_list: id
          config:
            severity: error
    columns:
    - name: id
      description: Id, unique identifier
      data_type: varchar

    - name: subscriber_id
      data_type: varchar

    - name: created_at
      data_type: timestamp_tz

    - name: updated_at_src
      data_type: timestamp_tz

    - name: deleted
      data_type: boolean

    - name: integrator_id
      data_type: varchar

    - name: type
      data_type: varchar

    - name: inserted_at
      description: Source Filename
      data_type: timestamp_tz
  
  - name: webhook_registration_curate
    description: Raw table for PEXAKey Subscriber ( property settelment RDS)
    tests:
      - check_unique_pk_effective_from:
          pk_field_list: registration_id
          config:
            severity: error
      - check_record_effectiveness_overlap:
          pk_field_list: registration_id
          config:
            severity: error
      - check_one_active_row:
          pk_field_list: registration_id
          config:
            severity: error
    columns:
    - name: registration_id
      data_type: varchar

    - name: webhook_url
      data_type: varchar

    - name: current_shared_secret
      data_type: varchar

    - name: current_shared_secret_expiry
      data_type: timestamp_tz

    - name: previous_shared_secret
      data_type: varchar

    - name: previous_shared_secret_expiry
      data_type: timestamp_tz
    
    - name: inserted_at_raw
      description: Inserted_at timestamp in the RAW layer, since the table doesn't have an audit field.
      data_type: timestamp_tz

    - name: inserted_at
      description: Source Filename
      data_type: timestamp_tz