version: 2

sources:
  - name: EXCHANGE_S3
    database: "{{env_var('DBT_EXCHANGE_RAW_DB')}}"
    schema: EXCHANGE
    loader: S3
    tables:
      - name: pxa_accounts
        description: external table to load the data from S3
        external:
          location: "@{{env_var('DBT_EXCHANGE_RAW_DB')}}.EXCHANGE.EXCHANGE_RDS_DMS_EXTRACT_S3_STAGE/pxa_accounts"
          file_format: "{{env_var('DBT_EXCHANGE_RAW_DB')}}.EXCHANGE.exchange_raw_csv_fileformat"
          partitions:
            - name: partition_name
              data_type: string
              expression: split_part(split_part(METADATA$FILENAME,'/',4),'-',1)
              # description: Partition Name
              # config:
              #   meta:
              #     alation_oid: oid=137187;otype=attribute
              #     alation_title: Partition Name
        columns:
          - name: op
            data_type: varchar
            description: Op
            config:
              meta:
                alation_oid: oid=137120;otype=attribute
                alation_title: Op

          - name: extraction_start_ts
            data_type: timestamp_ntz
            description: Extraction Start Timestamp
            config:
              meta:
                alation_oid: oid=136423;otype=attribute
                alation_title: Extraction Start Timestamp

          - name: account_id
            data_type: number
            description: A unique PEXA generated identifier for each bank account
              used on the platform.
            config:
              meta:
                alation_oid: oid=137344;otype=attribute
                alation_title: Account Id

          - name: version
            data_type: number
            description: Version
            config:
              meta:
                alation_oid: oid=137071;otype=attribute
                alation_title: Version

          - name: type1
            data_type: varchar
            description: When creating a new financial line item (FLI) for loan proceeds,
              loan payouts or lodgement fees, a new pxa_account record is created
              with type1 set to SETTLING or LODGE_FEE_ACCOUNT based on the FLI category.
            config:
              meta:
                alation_oid: oid=136568;otype=attribute
                alation_title: Type 1

          - name: holder
            data_type: varchar
            description: Holder
            config:
              meta:
                alation_oid: oid=136700;otype=attribute
                alation_title: Holder

          - name: bsb
            data_type: varchar
            description: "<div><p>A Bank State Branch (often referred to as \"BSB\"\
              ) is the name used in Australia for a bank code, which is a branch identifier.\_\
              </p><p>A BSB is normally used in association with the account number.</p></div>"
            config:
              meta:
                alation_oid: oid=137079;otype=attribute
                alation_title: Bank State Branch

          - name: number1
            data_type: varchar
            description: Bank account number.
            config:
              meta:
                alation_oid: oid=136676;otype=attribute
                alation_title: Number 1

          - name: financialaccount_id
            data_type: number
            description: Financial Account Id
            config:
              meta:
                alation_oid: oid=137306;otype=attribute
                alation_title: Financial Account Id

          - name: transact_seq
            data_type: number
            description: Transaction Sequence
            config:
              meta:
                alation_oid: oid=137265;otype=attribute
                alation_title: Transaction Sequence

        config:
          meta:
            alation_oid: oid=5624;otype=table
            alation_title: Accounts

