          file_format: "{{env_var('DBT_EXCHANGE_RAW_DB')}}.PROJECTS.PROJECTS_raw_csv_fileformat"
          partitions:
            - name: partition_name
              data_type: VARCHAR
              expression: split_part(split_part(METADATA$FILENAME,'/',4),'-',1)
        columns:
          - name: op
            data_type: VARCHAR

          - name: extraction_start_ts
            data_type: VARCHAR

          - name: id
            data_type: VARCHAR

          - name: endpoint_name
            data_type: VARCHAR

